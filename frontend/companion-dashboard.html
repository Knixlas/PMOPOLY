<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Åkepol — Vinstchans</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;0,8..60,700;1,8..60,400;1,8..60,600&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
    --paper:        #F1E8D6;
    --paper-deep:   #E6D9BD;
    --paper-edge:   #D9C9A8;
    --bg-card:      #FAF6EC;
    --ink:          #1A1410;
    --ink-mid:      #544A3F;
    --ink-faint:    #6B6056;
    --ink-line:     #9E968E;
    --burgundy:     #6B1815;
    --success:      #456020;
    --danger:       #6B1815;
    --info:         #4A5F6B;
    --border:       rgba(84,74,63,.22);
    --radius:       6px;
    --font-serif:   'Source Serif 4', Cambria, 'Times New Roman', serif;
    --font-mono:    'JetBrains Mono', 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font-serif); background: var(--paper); color: var(--ink); min-height: 100vh; padding: 32px 20px; -webkit-font-smoothing: antialiased; }
h1 { color: var(--ink); font-family: var(--font-serif); font-weight: 600; font-size: 2.2rem; text-align: center; margin-bottom: 4px; letter-spacing: 0; }
h1 em, h1 i { font-style: italic; color: var(--burgundy); font-weight: 400; }
.subtitle { text-align: center; color: var(--ink-mid); font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.18em; text-transform: uppercase; margin-bottom: 22px; }
.phase-bar { text-align: center; margin: 0 auto 22px; padding: 10px; background: var(--paper-deep); border-radius: var(--radius); border: 1px solid var(--border); max-width: 800px; }
.phase-bar .phase { color: var(--burgundy); font-family: var(--font-mono); font-size: 0.82rem; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 600; }
.phase-bar .step { color: var(--ink-mid); font-size: 0.92rem; font-style: italic; }

h2.section-head { max-width: 800px; margin: 22px auto 10px; color: var(--burgundy); font-family: var(--font-mono); font-size: 0.78rem; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 600; }

.leaderboard { max-width: 800px; margin: 0 auto; }
.lb-entry { display: flex; align-items: center; gap: 12px; padding: 12px 16px; margin-bottom: 6px; border-radius: var(--radius); background: var(--paper-deep); border: 1px solid var(--border); }
.lb-entry.lb-gold { border-left: 4px solid var(--burgundy); background: var(--bg-card); }
.lb-entry.lb-silver { border-left: 4px solid #8C8478; }
.lb-entry.lb-bronze { border-left: 4px solid #A06A2A; }
.lb-rank { font-family: var(--font-mono); font-size: 1.4rem; font-weight: 700; min-width: 36px; text-align: center; color: var(--ink-mid); }
.lb-entry.lb-gold .lb-rank { font-size: 1.6rem; color: var(--burgundy); }
.lb-entry.lb-silver .lb-rank { color: #8C8478; }
.lb-entry.lb-bronze .lb-rank { color: #A06A2A; }
.lb-info { flex: 1; }
.lb-name { font-size: 1rem; font-weight: 700; }
.lb-detail { font-size: 0.78rem; color: var(--ink-mid); margin-top: 2px; }
.lb-score { text-align: right; }
.lb-score-val { font-family: var(--font-mono); font-size: 1.4rem; font-weight: 700; }
.lb-score-label { font-family: var(--font-mono); font-size: 0.7rem; color: var(--ink-mid); text-transform: uppercase; letter-spacing: 0.08em; }
.lb-bar-bg { width: 100px; height: 6px; background: var(--paper-edge); border-radius: 3px; margin-top: 4px; }
.lb-bar { height: 6px; border-radius: 3px; background: linear-gradient(90deg, var(--success), var(--burgundy)); }
.lb-tier { font-size: 0.82rem; margin-top: 2px; font-style: italic; }
.lb-medal { font-size: 1.1rem; margin-right: 4px; }
.lb-trend-up { color: var(--success); }
.lb-trend-down { color: var(--danger); }

.quarters-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; margin-top: 22px; max-width: 800px; margin-left: auto; margin-right: auto; }
.q-mini { background: var(--paper-deep); border-radius: var(--radius); padding: 10px; text-align: center; border: 1px solid var(--border); }
.q-mini h4 { color: var(--burgundy); font-family: var(--font-mono); font-size: 0.78rem; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 600; margin-bottom: 4px; }
.q-mini .stat { font-size: 0.82rem; color: var(--ink-mid); }

.refresh-note { text-align: center; color: var(--ink-faint); font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase; margin-top: 22px; }
</style>
</head>
<body>
<h1>Åke<em>pol</em></h1>
<div class="subtitle">Vem har störst vinstchans?</div>
<div class="phase-bar">
    <div class="phase" id="db-phase">—</div>
    <div class="step" id="db-step">—</div>
</div>
<h2 class="section-head">Stadsdelar</h2>
<div class="leaderboard" id="db-districts"></div>
<h2 class="section-head">Dotterbolag</h2>
<div class="leaderboard" id="db-leaderboard"></div>
<div class="refresh-note">Uppdateras var 5:e sekund</div>

<script>
var TIERS = [
    { min: 80, label: 'Dominant', color: 'var(--burgundy)', emoji: '🟣' },
    { min: 60, label: 'Stark position', color: 'var(--success)', emoji: '🟢' },
    { min: 30, label: 'Medel', color: 'var(--ink-mid)', emoji: '🟡' },
    { min: -999, label: 'Riskfylld', color: 'var(--danger)', emoji: '🔴' },
];
function getTier(score) {
    return TIERS.find(function(t) { return score >= t.min; }) || TIERS[TIERS.length - 1];
}

const code = window.location.pathname.split('/').pop();

async function refresh() {
    try {
        const res = await fetch(`/api/companion/leaderboard/${code}`);
        if (!res.ok) return;
        const data = await res.json();

        document.getElementById('db-phase').textContent = data.phase_name || '—';
        document.getElementById('db-step').textContent = data.step_name || '—';

        // District ranking
        const districts = data.districts || [];
        let dHtml = '';
        for (const d of districts) {
            var dTier = getTier(d.avg_score);
            var dMedals = {1: '🥇', 2: '🥈', 3: '🥉'};
            var dMedal = dMedals[d.rank] || '';
            var dTopClass = d.rank === 1 ? 'lb-gold' : (d.rank === 2 ? 'lb-silver' : (d.rank === 3 ? 'lb-bronze' : ''));
            dHtml += `<div class="lb-entry ${dTopClass}">
                <div class="lb-rank">${dMedal || d.rank}</div>
                <div class="lb-info">
                    <div class="lb-name">${d.name}</div>
                    <div class="lb-detail">${d.num_players} spelare | #${d.rank} av ${data.total_districts || districts.length} stadsdelar</div>
                    <div class="lb-tier" style="color:${dTier.color}">${dTier.emoji} ${dTier.label}</div>
                </div>
                <div class="lb-score">
                    <div class="lb-score-val" style="color:${dTier.color}">${d.avg_score}</div>
                    <div class="lb-score-label">snitt</div>
                </div>
            </div>`;
        }
        if (districts.length === 0) dHtml = '<div style="text-align:center;color:var(--ink-faint);padding:20px;font-style:italic">Inga stadsdelar med projekt ännu…</div>';
        document.getElementById('db-districts').innerHTML = dHtml;

        // Player ranking
        const players = data.players || [];
        const maxScore = Math.max(1, ...players.map(e => e.profit_score));
        let html = '';
        for (const e of players) {
            const barW = Math.round((e.profit_score / maxScore) * 100);
            var pTier = getTier(e.profit_score);
            var pMedals = {1: '🥇', 2: '🥈', 3: '🥉'};
            var pMedal = pMedals[e.rank] || '';
            var topClass = e.rank === 1 ? 'lb-gold' : (e.rank === 2 ? 'lb-silver' : (e.rank === 3 ? 'lb-bronze' : ''));

            // Trend arrow
            var trendHtml = '';
            if (e.prev_profit_score && e.profit_score > e.prev_profit_score + 0.5) {
                trendHtml = '<span class="lb-trend-up"> ▲</span>';
            } else if (e.prev_profit_score && e.profit_score < e.prev_profit_score - 0.5) {
                trendHtml = '<span class="lb-trend-down"> ▼</span>';
            }

            html += `<div class="lb-entry ${topClass}">
                <div class="lb-rank">${pMedal || e.rank}</div>
                <div class="lb-info">
                    <div class="lb-name">${e.block_name || e.name}</div>
                    <div class="lb-detail">${e.district} | ${e.num_projects} projekt | BTA: ${e.total_bta}</div>
                    <div class="lb-tier" style="color:${pTier.color}">${pTier.emoji} ${pTier.label}</div>
                </div>
                <div class="lb-score">
                    <div class="lb-score-val" style="color:${pTier.color}">${e.profit_score}${trendHtml}</div>
                    <div class="lb-score-label">#${e.rank} av ${data.total_players || players.length}</div>
                    <div class="lb-bar-bg"><div class="lb-bar" style="width:${barW}%"></div></div>
                </div>
            </div>`;
        }
        if (players.length === 0) html = '<div style="text-align:center;color:var(--ink-faint);padding:20px;font-style:italic">Inga spelare med projekt ännu…</div>';
        document.getElementById('db-leaderboard').innerHTML = html;
    } catch (e) {}
}

refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
