<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Åkepol — Quiz Resultat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;0,8..60,700;1,8..60,400;1,8..60,600&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
    --paper:        #F1E8D6;
    --paper-deep:   #E6D9BD;
    --paper-edge:   #D9C9A8;
    --bg-card:      #FAF6EC;
    --ink:          #1A1410;
    --ink-mid:      #544A3F;
    --ink-faint:    #6B6056;
    --burgundy:     #6B1815;
    --success:      #456020;
    --danger:       #6B1815;
    --border:       rgba(84,74,63,.22);
    --radius:       6px;
    --font-serif:   'Source Serif 4', Cambria, 'Times New Roman', serif;
    --font-mono:    'JetBrains Mono', 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font-serif); background: var(--paper); color: var(--ink); min-height: 100vh; padding: 32px 20px; -webkit-font-smoothing: antialiased; }
h1 { color: var(--ink); font-family: var(--font-serif); font-weight: 600; font-size: 2.2rem; text-align: center; margin-bottom: 4px; }
h1 em, h1 i { font-style: italic; color: var(--burgundy); font-weight: 400; }
.subtitle { text-align: center; color: var(--ink-mid); font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.18em; text-transform: uppercase; margin-bottom: 22px; }
.stats-bar { text-align: center; max-width: 800px; margin: 0 auto 22px; padding: 12px; background: var(--paper-deep); border-radius: var(--radius); border: 1px solid var(--border); display: flex; justify-content: center; gap: 32px; flex-wrap: wrap; }
.stat-item { text-align: center; }
.stat-item .val { color: var(--burgundy); font-family: var(--font-mono); font-size: 1.6rem; font-weight: 700; }
.stat-item .lbl { color: var(--ink-mid); font-family: var(--font-mono); font-size: 0.7rem; letter-spacing: 0.12em; text-transform: uppercase; }

.leaderboard { max-width: 800px; margin: 0 auto; }
.lb-entry { display: flex; align-items: center; gap: 12px; padding: 12px 16px; margin-bottom: 6px; border-radius: var(--radius); background: var(--paper-deep); border: 1px solid var(--border); }
.lb-entry.lb-gold { border-left: 4px solid var(--burgundy); background: var(--bg-card); }
.lb-entry.lb-silver { border-left: 4px solid #8C8478; }
.lb-entry.lb-bronze { border-left: 4px solid #A06A2A; }
.lb-rank { font-family: var(--font-mono); font-size: 1.4rem; font-weight: 700; min-width: 36px; text-align: center; color: var(--ink-mid); }
.lb-entry.lb-gold .lb-rank { font-size: 1.6rem; color: var(--burgundy); }
.lb-entry.lb-silver .lb-rank { color: #8C8478; }
.lb-entry.lb-bronze .lb-rank { color: #A06A2A; }
.lb-info { flex: 1; }
.lb-name { font-size: 1rem; font-weight: 700; }
.lb-detail { font-size: 0.78rem; color: var(--ink-mid); margin-top: 2px; }
.lb-score { text-align: right; }
.lb-score-val { font-family: var(--font-mono); font-size: 1.4rem; font-weight: 700; color: var(--burgundy); }
.lb-score-label { font-family: var(--font-mono); font-size: 0.7rem; color: var(--ink-mid); text-transform: uppercase; letter-spacing: 0.08em; }
.lb-bar-bg { width: 100px; height: 6px; background: var(--paper-edge); border-radius: 3px; margin-top: 4px; }
.lb-bar { height: 6px; border-radius: 3px; background: linear-gradient(90deg, var(--success), var(--burgundy)); }
.lb-medal { font-size: 1.1rem; margin-right: 4px; }

.refresh-note { text-align: center; color: var(--ink-faint); font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase; margin-top: 22px; }
</style>
</head>
<body>
<h1>Åke<em>pol</em></h1>
<div class="subtitle">Quiz Resultat</div>
<div class="stats-bar" id="db-stats">
    <div class="stat-item"><div class="val" id="db-total-q">0</div><div class="lbl">Frågor</div></div>
    <div class="stat-item"><div class="val" id="db-total-p">0</div><div class="lbl">Spelare</div></div>
    <div class="stat-item"><div class="val" id="db-score-mode">—</div><div class="lbl">Räknas i total</div></div>
</div>
<div class="leaderboard" id="db-leaderboard"></div>
<div class="refresh-note">Uppdateras var 5:e sekund</div>

<script>
const code = window.location.pathname.split('/').pop();

async function refresh() {
    try {
        const res = await fetch(`/api/companion/quiz-leaderboard/${code}`);
        if (!res.ok) return;
        const data = await res.json();

        document.getElementById('db-total-q').textContent = data.total_questions_sent || 0;
        document.getElementById('db-total-p').textContent = (data.players || []).length;
        document.getElementById('db-score-mode').textContent = data.quiz_count_in_score ? 'Ja' : 'Nej';

        const players = data.players || [];
        const maxScore = Math.max(1, ...players.map(e => e.quiz_points));
        let html = '';
        for (const e of players) {
            const barW = Math.round((e.quiz_points / maxScore) * 100);
            var medals = {1: '🥇', 2: '🥈', 3: '🥉'};
            var medal = medals[e.rank] || '';
            var topClass = e.rank === 1 ? 'lb-gold' : (e.rank === 2 ? 'lb-silver' : (e.rank === 3 ? 'lb-bronze' : ''));

            html += `<div class="lb-entry ${topClass}">
                <div class="lb-rank">${medal || e.rank}</div>
                <div class="lb-info">
                    <div class="lb-name">${e.block_name || e.name}</div>
                    <div class="lb-detail">${e.district} | ${e.correct_answers}/${e.total_answered} rätt | snitt ${e.avg_time}s</div>
                </div>
                <div class="lb-score">
                    <div class="lb-score-val">${e.quiz_points}</div>
                    <div class="lb-score-label">#${e.rank} av ${players.length}</div>
                    <div class="lb-bar-bg"><div class="lb-bar" style="width:${barW}%"></div></div>
                </div>
            </div>`;
        }
        if (players.length === 0) html = '<div style="text-align:center;color:var(--ink-faint);padding:20px;font-style:italic">Inga quizsvar ännu…</div>';
        document.getElementById('db-leaderboard').innerHTML = html;
    } catch (e) {}
}

refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
